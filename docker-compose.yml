services:
  doorserver:
    # Named so the discord-bridge service below runs the same build.
    image: amiexpress-doorserver:latest
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Bound to loopback only - Caddy fronts this on the VPS and reverse
    # proxies to it. Publishing on 0.0.0.0 would expose it on every
    # interface, bypassing Caddy; harmless for anonymous reads today, wrong
    # the moment phase 3 adds /admin/*.
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - doorserver-data:/data
    networks:
      - default
      - doorserver-net
    environment:
      DOORSERVER_DB: /data/doors.db
      DOOR_ARCHIVES_ROOT: /data/Archives
      PORT: "3010"
      DOORSERVER_ADMIN_KEYS: ${DOORSERVER_ADMIN_KEYS:-}
      # The signing key is passed by the deploy workflow via
      # `export DOORSERVER_JWT_SECRET; docker compose up` - the workflow
      # writes the value from a GitHub Actions secret into its own
      # shell env, then exports it before compose runs. compose then
      # substitutes ${DOORSERVER_JWT_SECRET} in this block.
      DOORSERVER_JWT_SECRET: ${DOORSERVER_JWT_SECRET:-}
      # The achievements surface (docs/ACHIEVEMENTS-API.md). ACHIEVEMENTS_DB
      # sits on the SAME volume next to doors.db - no new container, no new
      # volume. It is set ONLY once SMTP is configured on the host: unset,
      # the surface is off and the door repo serves as before; set with no
      # SMTP, the server refuses to start (D7), which is the point.
      # Shared chat files (docs/CHAT-API.md section 9), on the same volume.
      CHAT_FILES_DIR: ${CHAT_FILES_DIR:-/data/chat-files}
      ACHIEVEMENTS_DB: ${ACHIEVEMENTS_DB:-}
      ACHIEVEMENTS_SMTP_URL: ${ACHIEVEMENTS_SMTP_URL:-}
      ACHIEVEMENTS_MAIL_FROM: ${ACHIEVEMENTS_MAIL_FROM:-}
      ACHIEVEMENTS_BASE_URL: ${ACHIEVEMENTS_BASE_URL:-https://doors.uprough.net}
      # The releases surface (docs/RELEASES-API.md). Same volume, own file,
      # own surface: empty when never imported (the server creates it, the
      # importer fills it offline via scripts/import-bbs-filelist.ts), and
      # everything else serves as before either way.
      RELEASES_DB: ${RELEASES_DB:-/data/releases.db}
      # Uploads wait in /data/quarantine (beside the database, never inside
      # the archive root); the server creates it at startup.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/api/door-repo/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LiveChat <> Discord bridge (docs/DISCORD-BRIDGE.md). Off unless the
  # profile is on: the deploy workflow writes COMPOSE_PROFILES=discord into
  # .env only when the three DISCORD_* secrets exist. Same image as the
  # hub, own process; it talks to the hub over HTTP like any federated board.
  discord-bridge:
    image: amiexpress-doorserver:latest
    pull_policy: never
    profiles: [discord]
    command: ["node", "dist/src/discord-bridge/index.js"]
    restart: unless-stopped
    depends_on:
      doorserver:
        condition: service_healthy
    volumes:
      - doorserver-data:/data
    environment:
      DISCORD_BRIDGE_HUB_URL: http://doorserver:3010
      DISCORD_BRIDGE_DB: /data/discord-bridge.db
      DISCORD_BRIDGE_BOARD_KEY: ${DISCORD_BRIDGE_BOARD_KEY:-}
      DISCORD_BRIDGE_ROOMS: ${DISCORD_BRIDGE_ROOMS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    # Health file is rewritten after every hub poll (25 s long-poll); stale
    # past 80 s or a gateway that is not ready marks the container unhealthy.
    healthcheck:
      test: ["CMD", "node", "dist/src/discord-bridge/health.js", "/data/discord-bridge.health", "80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  # Shared with the amiexpress-web (bbs) stack so the bbs container can
  # reach this container by service DNS as "doorserver". Created once on
  # the host via `docker network create doorserver-net` - not managed by
  # this compose file (external: true), since it's shared across two
  # independent compose projects. The loopback-only host port publish
  # above is unaffected - this only adds a second, container-to-container
  # path in.
  doorserver-net:
    external: true

volumes:
  doorserver-data:
    name: doorserver-data
