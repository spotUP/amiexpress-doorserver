services:
  doorserver:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Bound to loopback only - Caddy fronts this on the VPS and reverse
    # proxies to it. Publishing on 0.0.0.0 would expose it on every
    # interface, bypassing Caddy; harmless for anonymous reads today, wrong
    # the moment phase 3 adds /admin/*.
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - doorserver-data:/data
    networks:
      - default
      - doorserver-net
    environment:
      DOORSERVER_DB: /data/doors.db
      DOOR_ARCHIVES_ROOT: /data/Archives
      PORT: "3010"
      DOORSERVER_ADMIN_KEYS: ${DOORSERVER_ADMIN_KEYS:-}
      # The .env file (managed by the deploy workflow) holds the
      # signing key. We bind-mount it so an unset key produces a
      # predictable 503 on the admin API rather than a container
      # that silently boots with no auth surface.
      DOORSERVER_JWT_SECRET: ${DOORSERVER_JWT_SECRET:-}
    env_file:
      - path: .env
        required: false
      # Uploads wait in /data/quarantine (beside the database, never inside
      # the archive root); the server creates it at startup.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/api/door-repo/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # Shared with the amiexpress-web (bbs) stack so the bbs container can
  # reach this container by service DNS as "doorserver". Created once on
  # the host via `docker network create doorserver-net` - not managed by
  # this compose file (external: true), since it's shared across two
  # independent compose projects. The loopback-only host port publish
  # above is unaffected - this only adds a second, container-to-container
  # path in.
  doorserver-net:
    external: true

volumes:
  doorserver-data:
    name: doorserver-data
