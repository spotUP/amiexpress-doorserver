services:
  doorserver:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Bound to loopback only - Caddy fronts this on the VPS and reverse
    # proxies to it. Publishing on 0.0.0.0 would expose it on every
    # interface, bypassing Caddy; harmless for anonymous reads today, wrong
    # the moment phase 3 adds /admin/*.
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - doorserver-data:/data
      # The .env file is written by the deploy workflow at
      # /app/doorserver/.env on the host. We bind-mount it into the
      # container so docker compose can read it via env_file. The
      # production dist/ and node_modules/ are baked into the image
      # so only the .env is needed at runtime.
      - ./.env:/app/.env:ro
    networks:
      - default
      - doorserver-net
    environment:
      DOORSERVER_DB: /data/doors.db
      DOOR_ARCHIVES_ROOT: /data/Archives
      PORT: "3010"
      DOORSERVER_ADMIN_KEYS: ${DOORSERVER_ADMIN_KEYS:-}
      # DOORSERVER_JWT_SECRET is supplied via the .env file that the
      # deploy workflow writes on every run (see
      # .github/workflows/deploy-doorserver.yml). Older docker-compose
      # versions only support the long form env_file: below; newer
      # versions also accept the inline `key: value` we use above as
      # an override, which would shadow the file's value. To keep the
      # .env value authoritative we omit JWT_SECRET from environment:.
    env_file:
      - .env
      # Uploads wait in /data/quarantine (beside the database, never inside
      # the archive root); the server creates it at startup.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/api/door-repo/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # Shared with the amiexpress-web (bbs) stack so the bbs container can
  # reach this container by service DNS as "doorserver". Created once on
  # the host via `docker network create doorserver-net` - not managed by
  # this compose file (external: true), since it's shared across two
  # independent compose projects. The loopback-only host port publish
  # above is unaffected - this only adds a second, container-to-container
  # path in.
  doorserver-net:
    external: true

volumes:
  doorserver-data:
    name: doorserver-data
