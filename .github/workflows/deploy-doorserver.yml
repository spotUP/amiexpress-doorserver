name: Deploy door server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-doorserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOORSERVER_JWT_SECRET: ${{ secrets.DOORSERVER_JWT_SECRET }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          envs: DOORSERVER_JWT_SECRET
          script: |
            set -euo pipefail
            cd /app/doorserver
            echo "== disk before =="
            df -h / | tail -1
            echo "== git fetch + hard reset =="
            git fetch --prune origin main
            git reset --hard origin/main
            echo "== ensure .env is in place =="
            # The .env file is gitignored (correctly - it holds a signing
            # secret). The deploy workflow writes it from a GitHub Actions
            # secret on every run, so a container restart never has to guess
            # what's in the file. If the secret isn't set, the script
            # writes a placeholder and the admin API will return 503 - the
            # public site keeps working.
            #
            if [ -n "${DOORSERVER_JWT_SECRET:-}" ]; then
              printf 'DOORSERVER_JWT_SECRET=%s\n' "${DOORSERVER_JWT_SECRET}" > .env
              chmod 600 .env
              echo "[OK] .env written from secret (length ${#DOORSERVER_JWT_SECRET})"
            elif [ ! -f .env ]; then
              printf 'DOORSERVER_JWT_SECRET=\n' > .env
              echo "[WARN] DOORSERVER_JWT_SECRET not set in workflow; admin API will be disabled"
            fi
            echo "== prune builder cache + dangling/unused images (host runs at 91% disk, 3.6 GB free) =="
            docker builder prune -f
            # Dangling layers only: -a would remove all unused images, dangerous on unattended live host
            docker image prune -f
            echo "== build + up =="
            GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
            echo "== health =="
            sleep 10
            curl -fsS http://localhost:3010/api/door-repo/health
            echo "== disk after =="
            df -h / | tail -1
