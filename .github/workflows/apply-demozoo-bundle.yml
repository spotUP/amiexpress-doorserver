name: Apply demozoo sync bundle to live

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing the bundle (e.g. demozoo-bundle-20260829-173024)'
        required: true
        type: string

concurrency:
  group: apply-demozoo-bundle
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Download bundle from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="${RUNNER_TEMP}/demozoo-bundle"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$BUNDLE_DIR" \
            --pattern 'patch.sql' \
            --pattern 'submitted-files.tar.gz' \
            --pattern 'manifest.json'
          echo "== downloaded files =="
          ls -la "$BUNDLE_DIR"
          test -s "$BUNDLE_DIR/patch.sql"
          test -s "$BUNDLE_DIR/submitted-files.tar.gz"
          test -s "$BUNDLE_DIR/manifest.json"
          # Pack into a single tarball for one-shot transfer.
          cd "$BUNDLE_DIR"
          tar czf "${RUNNER_TEMP}/demozoo-bundle.tar.gz" \
            patch.sql submitted-files.tar.gz manifest.json
          ls -la "${RUNNER_TEMP}/demozoo-bundle.tar.gz"

      - name: rsync tarball to VPS
        # appleboy/scp-action always creates a folder, even for a
        # single file. The reliable alternative is rsync over SSH
        # using the secret key written to a tmpfile. This puts the
        # tarball at /tmp/demozoo-bundle.tar.gz on the VPS.
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/hetzner_apply_key
          printf '%s\n' "$HETZNER_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          # known_hosts: skip host key check (deploy-doorserver.yml
          # has the same setup). For one-shot workflows this is
          # acceptable; for recurring ones, set up known_hosts properly.
          rsync -avz -e "ssh -i $KEY_FILE -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            "${RUNNER_TEMP}/demozoo-bundle.tar.gz" \
            "root@${HETZNER_HOST}:/tmp/demozoo-bundle.tar.gz"
          rm -f "$KEY_FILE"

      - name: Apply bundle in doorserver container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            # Debug: see what /tmp/ looks like on the VPS.
            echo "== /tmp/ on VPS =="
            ls -la /tmp/ | head -20
            echo "== file type of /tmp/demozoo-bundle.tar.gz =="
            file /tmp/demozoo-bundle.tar.gz || true
            stat /tmp/demozoo-bundle.tar.gz || true
            echo "== size if file =="
            if [ -f /tmp/demozoo-bundle.tar.gz ]; then
              ls -la /tmp/demozoo-bundle.tar.gz
            fi
            echo "== content if dir =="
            if [ -d /tmp/demozoo-bundle.tar.gz ]; then
              ls -la /tmp/demozoo-bundle.tar.gz/
            fi
            # If it's a dir from a previous failed run, nuke it.
            rm -rf /tmp/demozoo-bundle.tar.gz
            # We need to re-transfer. The bundle should already be
            # on the VPS from the rsync step, but if it got put in
            # a folder somehow, we need to pull the actual file.
            # Use the bundle files directly from the release instead
            # of the tarball — split the rsync into per-file copies
            # that won't get auto-foldered.
            echo "== after cleanup =="
            ls -la /tmp/demozoo-bundle.tar.gz 2>&1 || true
            exit 1  # FAIL HERE so we can see the debug output

      - name: Delete draft release (one-shot)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --yes || echo "release already deleted, ignoring"
