name: Apply demozoo sync bundle to live

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing the bundle (e.g. demozoo-bundle-20260829-173024)'
        required: true
        type: string

concurrency:
  group: apply-demozoo-bundle
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Download bundle from release (onto GHA runner)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="${RUNNER_TEMP}/demozoo-bundle"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$BUNDLE_DIR" \
            --pattern 'patch.sql' \
            --pattern 'submitted-files.tar.gz' \
            --pattern 'manifest.json'
          echo "== downloaded files =="
          ls -la "$BUNDLE_DIR"
          test -s "$BUNDLE_DIR/patch.sql"
          test -s "$BUNDLE_DIR/submitted-files.tar.gz"
          test -s "$BUNDLE_DIR/manifest.json"
          # Persist for next step
          echo "BUNDLE_DIR=${BUNDLE_DIR}" >> "$GITHUB_ENV"
          echo "::notice title=bundle staged::${BUNDLE_DIR}"

      - name: Copy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "${{ env.BUNDLE_DIR }}"
          target: "/tmp/demozoo-bundle"
          overwrite: true

      - name: Apply bundle in doorserver container
        uses: appleboy/ssh-action@v1.0.3
        env:
          BUNDLE_DIR: ${{ env.BUNDLE_DIR }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "== bundle on VPS =="
            ls -la /tmp/demozoo-bundle/
            CONTAINER=$(docker ps --format '{{.Names}}' | grep -E '(^|[-_])doorserver([-_]|$)' | head -1)
            if [ -z "$CONTAINER" ]; then
              echo "ERROR: no doorserver container found"
              docker ps -a
              exit 1
            fi
            echo "== container: $CONTAINER =="
            echo "== before =="
            docker exec "$CONTAINER" sqlite3 /data/doors.db \
              "SELECT source, COUNT(*) FROM door_catalog GROUP BY source"
            echo "== copy bundle into container =="
            docker cp /tmp/demozoo-bundle "$CONTAINER:/tmp/demozoo-bundle"
            echo "== apply =="
            docker exec -w /app/doorserver "$CONTAINER" \
              npx tsx scripts/demozoo-sync-apply.ts /tmp/demozoo-bundle
            echo "== after =="
            docker exec "$CONTAINER" sqlite3 /data/doors.db \
              "SELECT source, COUNT(*) FROM door_catalog GROUP BY source"
            echo "== cleanup =="
            docker exec "$CONTAINER" rm -rf /tmp/demozoo-bundle
            rm -rf /tmp/demozoo-bundle
            echo "== done =="

      - name: Delete draft release (one-shot)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --yes || echo "release already deleted, ignoring"
